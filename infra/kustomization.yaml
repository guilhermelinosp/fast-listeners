# Tag da imagem: o workflow argocd ajusta (argocd app set --kustomize-image) ou edite aqui.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fast
resources:
- deployment.yaml
configMapGenerator:
- name: fast-listeners
  envs:
  - config.env
labels:
- pairs:
    app.kubernetes.io/name: hellnet-service
    app.kubernetes.io/instance: fast-listeners
  includeSelectors: false
images:
- name: ghcr.io/guilhermelinosp/fast-listeners
  newTag: v1.2.2
